name: ${CONTAINER_NAME}

services:
  postgres:
    image: postgres:18.4
    container_name: ${CONTAINER_NAME}-postgres
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "${POSTGRES_EXTERNAL_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    image: ${CONTAINER_NAME}:latest
    build:
      context: ../..
      dockerfile: deploy/spring-3.9-java-17-postgres-18-4/Dockerfile
    container_name: ${CONTAINER_NAME}
    restart: ${RESTART_POLICY:-unless-stopped}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${EXTERNAL_PORT}:${INTERNAL_PORT}"
    env_file:
      - path: ../runtime.env
        required: false
    volumes:
      - ../application.properties:/config/application.properties:ro
      - ${LOGS_VOLUME:-/var/log}/${CONTAINER_NAME}:/app/logs
    environment:
      SERVER_PORT: ${INTERNAL_PORT}
      SPRING_CONFIG_LOCATION: optional:file:/config/application.properties
      LOGGING_FILE_PATH: /app/logs
      LOGGING_FILE_BASENAME: ${CONTAINER_NAME}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASS: ${POSTGRES_PASS}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASS}

volumes:
  postgres_data:
    name: ${CONTAINER_NAME}_postgres_data
