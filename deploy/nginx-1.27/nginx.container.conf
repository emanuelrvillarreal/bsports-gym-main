server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location ~* \.(?:css|js|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|eot|mp4|webm|ogg|mov|avi|mkv|m4v|pdf|json|webmanifest)$ {
        try_files $uri =404;
        add_header Accept-Ranges bytes;
        expires 7d;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
