location /{PATH}/api {
    proxy_pass http://127.0.0.1:{PORT}/api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Streaming (SSE) de presencia en vivo del club: sin proxy_buffering off,
# nginx retiene la respuesta en su buffer y nunca la reenvia al cliente
# mientras la conexion con el backend siga abierta (esta nunca se cierra).
location /{PATH}/api/acceso-club/live {
    proxy_pass http://127.0.0.1:{PORT}/api/acceso-club/live;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;
    proxy_read_timeout 3600s;
}
