      summary: Alta de familiar por socio titular (portal)
      operationId: memberPortalAltaFamiliar
      description: |
        **Portal.** El socio titular autenticado da de alta un integrante de su grupo familiar.
        El titular se resuelve por sesiÃ³n (sin UUID en el body).
        Requiere permiso `portal.family.create` y header `X-Company-Uuid`.
        Si el email no existe, crea usuario (requiere `password`) con `status = -2`.
        Crea el member familiar con `status = -2` (pendiente de aprobaciÃ³n) y notifica al club.
        Si el email ya existe, reutiliza el usuario y crea el member familiar pendiente.
        Si ya tiene solicitud pendiente o es socio activo del club, responde 409.
      parameters:
        - name: X-Company-Uuid
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberPortalFamiliarAltaCommand'
