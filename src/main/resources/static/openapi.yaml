paths:
  /actuator/health:
    get:
      tags: [Actuator]
      summary: Health check
      operationId: actuatorHealth
      security: []
      description: |
        **PÃºblico.** No requiere autenticaciÃ³n.
      responses:
        '200':
          description: AplicaciÃ³n en ejecuciÃ³n
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /configuracion/all:
    get:
      tags: [Configuracion]
      summary: Listar configuraciones
      operationId: configuracionGetAll
      description: |
        Si el usuario tiene permiso `configuration.view`, devuelve todas las filas.
        Si no, solo las variables **pÃºblicas** (`global=true`).
        **Permisos:** opcional `configuration.view`; sin autenticaciÃ³n se aplican solo pÃºblicas si el backend lo permite.
      responses:
        '200':
          description: Lista de configuraciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConfigurationDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /configuracion/get/{key}:
    get:
      tags: [Configuracion]
      summary: Obtener configuraciÃ³n por clave
      operationId: configuracionGetOne
      description: |
        Variables globales visibles para cualquiera con la clave. Variables privadas requieren `configuration.view`.
        **Permisos:** `configuration.view` para claves no globales.
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ConfiguraciÃ³n encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /configuracion/get/list:
    post:
      tags: [Configuracion]
      summary: Obtener varias configuraciones por lista de claves
      operationId: configuracionGetList
      description: |
        Si no es administrador global (`ADMIN`), no puede pedir variables privadas en la lista.
        **Permisos:** rol `ADMIN` para incluir claves privadas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
            example: ["clave.publica", "otra"]
      responses:
        '200':
          description: Lista encontrada
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConfigurationDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

