              cuotaSocialHabilitada: true
              admin:
                nombre: MarÃ­a
                apellido: GonzÃ¡lez
                email: admin@catnorte.com
                password: "ClaveSegura123!"
      responses:
        '201':
          description: Club y administrador creados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubRegistrationResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
