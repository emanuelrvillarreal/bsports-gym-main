  - url: /bsports-club/api
    description: Staging detrÃ¡s de nginx (prefijo del proyecto)

tags:
  - name: Actuator
    description: Salud del servicio
  - name: Autenticacion y usuarios
    description: JWT, sesiÃ³n, registro pÃºblico, tokens personales y CRUD usuario
  - name: Empresas
    description: CRUD empresas (companies)
  - name: Roles
    description: CRUD roles por empresa
  - name: Permisos
    description: CRUD permisos del sistema
  - name: Configuracion
    description: Variables de sistema pÃºblicas/privadas
  - name: Sysadmin
    description: Alta de clubes desde panel interno B Sport (solo SYSADMIN)
  - name: Socios
    description: Alta y gestiÃ³n de socios titulares y familiares
  - name: Tesoreria
    description: Cuotas, cobros y generaciÃ³n diaria
  - name: Actividades
    description: Comisiones y listado paginado
  - name: Profesores
    description: Profesores del club
  - name: Recepcionistas
    description: Usuarios recepcionistas del club (rol ADM_RECEPCION)
  - name: Categorias
    description: CategorÃ­as de edad para actividades y socios
  - name: Amenities
    description: Amenities y reservas
  - name: Eventos de actividad
    description: ABM de eventos puntuales vinculados a actividades
  - name: Calendario
    description: Vista combinada de slots recurrentes y eventos de actividad
  - name: Accesos al club
