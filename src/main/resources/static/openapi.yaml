  /member/import:
    post:
      tags: [Socios]
      summary: ImportaciÃ³n masiva de socios (Excel)
      operationId: memberBulkImport
      description: |
        **Backoffice â€” migraciÃ³n.** Importa socios titulares y familiares desde Excel (`.xls` o `.xlsx`).
        Requiere permisos `member.create` y `family.create` y header `X-Company-Uuid`.

        **Columnas** (encabezados en espaÃ±ol, case-insensitive): `Nombre`, `Apellido`, `DNI`, `Email`,
        `ContraseÃ±a`, `TelÃ©fono`, `Fecha de nacimiento`, `NÃºmero de socio`, `Fecha de alta`, `Parentesco`, `Titular DNI`.

        - Fila **titular**: `Titular DNI` y `Parentesco` vacÃ­os.
        - Fila **familiar**: ambos informados; `Titular DNI` acepta DNI o email del titular.
        - `Parentesco`: `CONYUGE`, `HIJO`, `HIJA`, `PADRE`, `MADRE`, `OTRO` (case-insensitive).
        - Fechas solo texto `dd/MM/yyyy`; otro formato â†’ advertencia y campo nulo (`Fecha de nacimiento` obligatoria).
        - No importa filas cuyo email o DNI coincida con un **usuario activo** (`status = 0`).
        - Crea usuario nuevo si no hay activo (incluye usuarios eliminados `status = -1`).
        - ImportaciÃ³n **parcial**: responde 200 con reporte fila a fila (`SUCCESS` / `ERROR`).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Archivo Excel (.xls o .xlsx)
      responses:
        '200':
          description: Resultado de importaciÃ³n (puede incluir errores parciales por fila)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberBulkImportResultDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

