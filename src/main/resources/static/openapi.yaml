  /member/public/titular:
    post:
      tags: [Socios]
      summary: Registro pÃºblico de socio titular
      operationId: memberPublicRegistroTitular
      security: []
      description: |
        **PÃºblico.** Registra un socio titular en el club indicado por `X-Company-Uuid`.
        Si el email no existe, crea usuario (requiere `password`) y socio con `status = -2` (pendiente de aprobaciÃ³n).
        Si el email ya existe, reutiliza el usuario y crea el socio pendiente en ese club (sin `password`).
        Notifica al club vÃ­a `emailInstitucional`. El socio queda activo (`status = 0`) tras aprobaciÃ³n en backoffice.
        Si ya tiene solicitud pendiente o es socio activo del club, responde 409.
      parameters:
        - name: X-Company-Uuid
          in: header
          required: false
          schema:
            type: string
          description: UUID del club (obligatorio en modo multi-empresa)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberPublicRegistroCommand'
      responses:
        '200':
          description: Socio titular registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /member/portal/familiar:
