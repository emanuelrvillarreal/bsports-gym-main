<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codigo de verificacion</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f4f7fb;
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      color: #0f2748;
    "
  >
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color: #f4f7fb; padding: 24px 12px">
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            style="
              max-width: 560px;
              background-color: #ffffff;
              border: 1px solid #d7e2ee;
              border-radius: 18px;
              overflow: hidden;
              box-shadow: 0 18px 40px rgba(15, 39, 72, 0.1);
            "
          >
            <tr>
              <td align="center" style="padding: 32px 24px 16px">
                <img
                  src="{baseUrl}/assets/logo-empresa/logoBlueOpenData.png"
                  alt="Blue Open Data"
                  width="180"
                  style="display: block; width: 180px; max-width: 100%; height: auto"
                />
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 0 24px 8px">
                <h1 style="margin: 0; font-size: 28px; line-height: 1.15; color: #0d2347; font-weight: 800">Blue Open Data</h1>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 0 24px 12px">
                <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #6b819d">Codigo de verificacion de cuenta</p>
              </td>
            </tr>
            <tr>
              <td style="padding: 0 24px 12px">
                <div
                  style="
                    border-radius: 16px;
                    border: 1px solid #d8e4f2;
                    background: linear-gradient(180deg, #f8fbff 0%, #eef4fb 100%);
                    padding: 24px;
                  "
                >
                  <p style="margin: 0 0 12px; font-size: 18px; line-height: 1.5; color: #0d2347; font-weight: 800">
                    Hola {user}!
                  </p>
                  <p style="margin: 0 0 10px; font-size: 15px; line-height: 1.6; color: #4f6788">
                    Gracias por registrarte en Blue Open Data.
                  </p>
                  <p style="margin: 0 0 16px; font-size: 15px; line-height: 1.6; color: #4f6788">
                    Tu codigo de verificacion es:
                  </p>
                  <div
                    style="
                      margin: 0 0 18px;
                      padding: 16px 20px;
                      border-radius: 14px;
                      border: 1px dashed #3267d6;
                      background-color: #ffffff;
                      color: #0d2347;
                      font-size: 28px;
                      font-weight: 800;
                      letter-spacing: 6px;
                      text-align: center;
                    "
                  >
                    {code}
                  </div>
                  <p style="margin: 0 0 8px; font-size: 14px; line-height: 1.6; color: #4f6788">Este codigo expira en 10 minutos.</p>
                  <p style="margin: 0; font-size: 14px; line-height: 1.6; color: #4f6788">
                    Si no has solicitado este codigo, puedes ignorar este correo.
                  </p>
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding: 0 24px 24px">
                <p style="margin: 0; font-size: 14px; line-height: 1.7; color: #6b819d">
                  Saludos,<br />
                  El equipo de Blue Open Data
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
